# =============================================================================
# ENTERPRISE-GRADE NGINX SECURITY CONFIGURATION
# Valt OmniAgent - omni.valtara.ai
# =============================================================================
# Features:
# - DDoS/DoS Protection with rate limiting
# - Connection limiting per IP
# - Request size limiting
# - Slowloris attack mitigation
# - SSL/TLS hardening with A+ grade
# - Security headers (OWASP recommendations)
# - Bot/crawler protection
# - Geographic blocking (optional)
# - Request filtering
# =============================================================================

# -----------------------------------------------------------------------------
# RATE LIMITING ZONES (DDoS Protection)
# -----------------------------------------------------------------------------
# Zone for general request rate limiting (10 requests/sec burst 20)
limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

# Zone for login/API endpoint protection (5 requests/sec)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

# Zone for strict endpoints (1 request/sec - signup, password reset)
limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=1r/s;

# Zone for static files (higher limit - 50 requests/sec)
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=50r/s;

# -----------------------------------------------------------------------------
# CONNECTION LIMITING ZONES (Prevent connection flooding)
# -----------------------------------------------------------------------------
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_conn_zone $server_name zone=server_conn_limit:10m;

# -----------------------------------------------------------------------------
# BLOCKED IPS/BOTS MAP
# -----------------------------------------------------------------------------
map $http_user_agent $bad_bot {
    default 0;
    ~*malicious 1;
    ~*bot 0;  # Allow legitimate bots
    ~*crawl 0;
    ~*spider 0;
    ~*scanner 1;
    ~*nikto 1;
    ~*sqlmap 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*curl 0;  # Allow curl for health checks
    ~*wget 0;
    ~*python-requests 1;
    ~*libwww 1;
    ~*lwp-trivial 1;
    ~*mj12bot 1;
    ~*ahrefsbot 1;
    ~*semrushbot 1;
}

# Block empty user agents (often attackers)
map $http_user_agent $empty_ua {
    default 0;
    "" 1;
}

# -----------------------------------------------------------------------------
# UPSTREAM CONFIGURATION
# -----------------------------------------------------------------------------
upstream valt_omniagent {
    server localhost:3000 max_fails=3 fail_timeout=30s;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# -----------------------------------------------------------------------------
# HTTP SERVER - REDIRECT TO HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name omni.valtara.ai www.omni.valtara.ai _;

    # Rate limiting on HTTP
    limit_req zone=req_limit burst=20 nodelay;
    limit_conn conn_limit 20;

    # Block bad bots immediately
    if ($bad_bot) {
        return 444;
    }

    # Allow ACME challenge for SSL renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS SERVER - MAIN APPLICATION
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name omni.valtara.ai www.omni.valtara.ai;

    # -------------------------------------------------------------------------
    # SSL/TLS CONFIGURATION (A+ Grade)
    # -------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/omni.valtara.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omni.valtara.ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/omni.valtara.ai/chain.pem;

    # Modern TLS only (TLS 1.2 and 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong cipher suites (Mozilla Modern compatibility)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session caching for performance
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # DH parameters (generate with: openssl dhparam -out /etc/nginx/dhparam.pem 4096)
    # ssl_dhparam /etc/nginx/dhparam.pem;

    # -------------------------------------------------------------------------
    # SECURITY HEADERS (OWASP Recommendations)
    # -------------------------------------------------------------------------
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS Protection (legacy, but still useful)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy (formerly Feature-Policy)
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # HTTP Strict Transport Security (HSTS) - 2 years with preload
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Prevent server information disclosure
    server_tokens off;

    # -------------------------------------------------------------------------
    # DDoS/DoS PROTECTION
    # -------------------------------------------------------------------------
    # Global rate limiting
    limit_req zone=req_limit burst=20 nodelay;

    # Connection limits per IP
    limit_conn conn_limit 30;
    limit_conn server_conn_limit 1000;

    # Rate limit error responses
    limit_req_status 429;
    limit_conn_status 429;

    # Request body size limit (prevents large payload attacks)
    client_max_body_size 10M;

    # Timeouts (Slowloris attack mitigation)
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # Buffer size limits (Buffer overflow protection)
    client_body_buffer_size 1K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # -------------------------------------------------------------------------
    # BAD BOT/SCANNER BLOCKING
    # -------------------------------------------------------------------------
    if ($bad_bot) {
        return 444;
    }

    # Block empty user agents (configurable)
    # if ($empty_ua) {
    #     return 444;
    # }

    # Block certain HTTP methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$) {
        return 444;
    }

    # -------------------------------------------------------------------------
    # LOGGING
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/omni.valtara.ai.access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/omni.valtara.ai.error.log warn;

    # -------------------------------------------------------------------------
    # ROOT AND COMPRESSION
    # -------------------------------------------------------------------------
    root /var/www/valt-omniagent;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon;

    # Brotli compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # -------------------------------------------------------------------------
    # STATIC FILES (Higher rate limits)
    # -------------------------------------------------------------------------
    location /_next/static {
        limit_req zone=static_limit burst=100 nodelay;
        alias /var/www/valt-omniagent/.next/static;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /static {
        limit_req zone=static_limit burst=100 nodelay;
        alias /var/www/valt-omniagent/public;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot|webp|avif)$ {
        limit_req zone=static_limit burst=100 nodelay;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -------------------------------------------------------------------------
    # SECURITY-SENSITIVE ENDPOINTS (Strict rate limiting)
    # -------------------------------------------------------------------------
    location ~ ^/api/auth/(signin|signup|register|login|forgot-password|reset-password) {
        limit_req zone=strict_limit burst=3 nodelay;
        limit_conn conn_limit 5;

        proxy_pass http://valt_omniagent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ ^/(signin|signup|login|register|auth) {
        limit_req zone=login_limit burst=10 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://valt_omniagent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
    }

    # -------------------------------------------------------------------------
    # API ENDPOINTS (Moderate rate limiting)
    # -------------------------------------------------------------------------
    location /api {
        limit_req zone=login_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://valt_omniagent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # HEALTH CHECK ENDPOINT (No rate limiting for monitoring)
    # -------------------------------------------------------------------------
    location /health {
        access_log off;
        proxy_pass http://valt_omniagent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/health {
        access_log off;
        proxy_pass http://valt_omniagent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # FAVICON AND ROBOTS
    # -------------------------------------------------------------------------
    location = /favicon.ico {
        alias /var/www/valt-omniagent/public/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        alias /var/www/valt-omniagent/public/robots.txt;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # BLOCK SENSITIVE FILES
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|git|gitignore|dockerignore|sql|bak|backup|log|ini|conf|config)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (wp-admin|wp-login|wp-content|wp-includes|phpmyadmin|administrator|admin\.php) {
        return 444;
    }

    # -------------------------------------------------------------------------
    # MAIN APPLICATION PROXY
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://valt_omniagent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Proxy buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;
    }

    # -------------------------------------------------------------------------
    # ERROR PAGES
    # -------------------------------------------------------------------------
    error_page 429 /429.html;
    location = /429.html {
        internal;
        default_type text/html;
        return 429 '<!DOCTYPE html><html><head><title>Too Many Requests</title></head><body><h1>429 - Too Many Requests</h1><p>You have exceeded the rate limit. Please try again later.</p></body></html>';
    }

    error_page 444 /444.html;
    location = /444.html {
        internal;
        default_type text/html;
        return 444 '';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><title>Service Unavailable</title></head><body><h1>Service Temporarily Unavailable</h1><p>Please try again later.</p></body></html>';
    }
}

# -----------------------------------------------------------------------------
# CATCH-ALL SERVER (Block unknown hosts)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/omni.valtara.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omni.valtara.ai/privkey.pem;

    # Return 444 (connection closed without response) for unknown hosts
    return 444;
}
