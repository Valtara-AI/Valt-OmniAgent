# Nginx configuration for omni.valtara.ai
# Place this file at: /etc/nginx/sites-available/omni.valtara.ai
# Enable with: sudo ln -s /etc/nginx/sites-available/omni.valtara.ai /etc/nginx/sites-enabled/

upstream valt_omniagent {
    server localhost:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name omni.valtara.ai www.omni.valtara.ai;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name omni.valtara.ai www.omni.valtara.ai;

    # SSL Configuration (update these paths after setting up SSL)
    ssl_certificate /etc/letsencrypt/live/omni.valtara.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omni.valtara.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/omni.valtara.ai.access.log;
    error_log /var/log/nginx/omni.valtara.ai.error.log;

    # Root and index
    root /var/www/valt-omniagent;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Static files
    location /_next/static {
        alias /var/www/valt-omniagent/.next/static;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /static {
        alias /var/www/valt-omniagent/public;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Favicon and robots.txt
    location = /favicon.ico {
        alias /var/www/valt-omniagent/public/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        alias /var/www/valt-omniagent/public/robots.txt;
        access_log off;
        log_not_found off;
    }

    # Proxy to Next.js
    location / {
        proxy_pass http://valt_omniagent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
