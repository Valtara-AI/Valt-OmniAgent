# Minimal HTTP-only Nginx config for omni.valtara.ai
# Listens on port 80 and proxies to local Next.js server on 3000

upstream valt_omniagent {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name omni.valtara.ai www.omni.valtara.ai;

    # Root (for certbot webroot if needed)
    root /var/www/valt-omniagent/public;

    # Static
    location /_next/static {
        alias /var/www/valt-omniagent/.next/static;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /static {
        alias /var/www/valt-omniagent/public;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { alias /var/www/valt-omniagent/public/favicon.ico; access_log off; log_not_found off; }
    location = /robots.txt { alias /var/www/valt-omniagent/public/robots.txt; access_log off; log_not_found off; }

    # Proxy to Next.js
    location / {
        proxy_pass http://valt_omniagent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
