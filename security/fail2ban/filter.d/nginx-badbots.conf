# Fail2ban filter for Nginx bad bots and scanners
# File: /etc/fail2ban/filter.d/nginx-badbots.conf

[Definition]
# Detect scanners and malicious bots
failregex = ^<HOST> .* "(GET|POST|HEAD).*HTTP.*" .* "(python-requests|nikto|nmap|sqlmap|masscan|dirbuster|gobuster|wfuzz|hydra|medusa|acunetix|nessus|openvas|burp|zaproxy|owasp|nuclei).*"$
            ^<HOST> .* "(GET|POST|HEAD).*(wp-admin|wp-login|phpmyadmin|admin\.php|administrator|\.env|\.git|config\.php|setup\.php).*HTTP.*"
            ^<HOST> .* ".*\\x.*" \d+
            ^<HOST> .* "() " \d+

ignoreregex =

# Filter description
# This filter catches:
# 1. Known vulnerability scanners in user-agent
# 2. WordPress/PHPMyAdmin probes
# 3. Hex encoded attacks
# 4. Empty user agents
