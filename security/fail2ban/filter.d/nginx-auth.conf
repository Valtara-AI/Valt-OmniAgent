# Fail2ban filter for Nginx authentication abuse
# File: /etc/fail2ban/filter.d/nginx-auth.conf

[Definition]
# Detect repeated failed authentication attempts
failregex = ^<HOST> .* "(GET|POST) /(signin|signup|login|register|auth|api/auth).* HTTP.*" (401|403|429) .*$
            ^<HOST> .* "(GET|POST) /api/auth/(signin|signup|login|register|forgot-password).* HTTP.*" 4\d\d .*$

ignoreregex =

# Filter description
# This filter catches:
# 1. Failed authentication attempts (401, 403, 429)
# 2. Brute force login attempts
# 3. API authentication abuse
