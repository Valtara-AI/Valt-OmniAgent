# Fail2ban filter for Nginx DDoS/Attack protection
# File: /etc/fail2ban/filter.d/nginx-ddos.conf

[Definition]
# Detect multiple rapid requests (potential DDoS)
failregex = ^<HOST>.*"(GET|POST|HEAD|PUT|DELETE|PATCH).*HTTP.*" (429|444|403) .*$
            ^<HOST>.*"(GET|POST|HEAD|PUT|DELETE|PATCH).*HTTP.*" \d+ \d+ "-" "-"$
            ^<HOST> .* "(GET|POST|HEAD|PUT|DELETE|PATCH) [^"]+" 444
            limiting requests, excess: .* by zone .*, client: <HOST>

ignoreregex =

# Filter description
# This filter catches:
# 1. HTTP 429 (Too Many Requests) responses
# 2. HTTP 444 (Nginx connection closed)
# 3. HTTP 403 (Forbidden) responses
# 4. Requests with empty user-agent and referrer
# 5. Rate limit log messages
