# ============================================================================
# FAIL2BAN JAIL CONFIGURATION FOR VALT OMNIAGENT
# Enterprise-Grade Security
# ============================================================================
# File: /etc/fail2ban/jail.d/nginx-valt.conf
# ============================================================================

# ----------------------------------------------------------------------------
# DEFAULT SETTINGS
# ----------------------------------------------------------------------------
[DEFAULT]
# Ban duration (1 hour default, repeat offenders get longer)
bantime = 1h

# Find time window (10 minutes)
findtime = 10m

# Max retries before ban
maxretry = 5

# Action to take (ban IP with iptables and send email alert if configured)
banaction = iptables-multiport
banaction_allports = iptables-allports

# Ignore local IPs
ignoreip = 127.0.0.1/8 ::1

# ----------------------------------------------------------------------------
# NGINX DDoS PROTECTION
# ----------------------------------------------------------------------------
[nginx-ddos]
enabled = true
filter = nginx-ddos
port = http,https
logpath = /var/log/nginx/omni.valtara.ai.access.log
           /var/log/nginx/error.log
maxretry = 30
findtime = 60
bantime = 3600
action = iptables-multiport[name=nginx-ddos, port="http,https", protocol=tcp]

# ----------------------------------------------------------------------------
# NGINX RATE LIMIT VIOLATIONS
# ----------------------------------------------------------------------------
[nginx-limit-req]
enabled = true
filter = nginx-limit-req
port = http,https
logpath = /var/log/nginx/error.log
maxretry = 10
findtime = 120
bantime = 7200
action = iptables-multiport[name=nginx-limit, port="http,https", protocol=tcp]

# ----------------------------------------------------------------------------
# NGINX BAD BOTS & SCANNERS
# ----------------------------------------------------------------------------
[nginx-badbots]
enabled = true
filter = nginx-badbots
port = http,https
logpath = /var/log/nginx/omni.valtara.ai.access.log
maxretry = 2
findtime = 300
bantime = 86400
action = iptables-multiport[name=nginx-badbots, port="http,https", protocol=tcp]

# ----------------------------------------------------------------------------
# NGINX AUTHENTICATION ABUSE (Brute Force)
# ----------------------------------------------------------------------------
[nginx-auth]
enabled = true
filter = nginx-auth
port = http,https
logpath = /var/log/nginx/omni.valtara.ai.access.log
maxretry = 5
findtime = 300
bantime = 3600
action = iptables-multiport[name=nginx-auth, port="http,https", protocol=tcp]

# ----------------------------------------------------------------------------
# SSH BRUTE FORCE (Enhanced)
# ----------------------------------------------------------------------------
[sshd]
enabled = true
port = ssh
filter = sshd
logpath = /var/log/auth.log
maxretry = 3
findtime = 600
bantime = 86400
action = iptables-multiport[name=sshd, port="ssh", protocol=tcp]

# ----------------------------------------------------------------------------
# SSH DDOS PROTECTION
# ----------------------------------------------------------------------------
[sshd-ddos]
enabled = true
port = ssh
filter = sshd-ddos
logpath = /var/log/auth.log
maxretry = 6
findtime = 30
bantime = 172800
action = iptables-multiport[name=sshd-ddos, port="ssh", protocol=tcp]

# ----------------------------------------------------------------------------
# RECIDIVE (Repeat Offenders)
# Ban IPs that get banned multiple times - LONGER BANS
# ----------------------------------------------------------------------------
[recidive]
enabled = true
filter = recidive
logpath = /var/log/fail2ban.log
action = iptables-allports[name=recidive]
bantime = 1w
findtime = 1d
maxretry = 3
